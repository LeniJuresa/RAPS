<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body {
          font-family: Arial, Helvetica, sans-serif;
          background-color: #272626;
          margin: 0;
          padding: 20px;
          color: #d0cfcf;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #d0cfcf;
            margin-bottom: 10px;
            font-size: 1.8rem;

        }
        .podnaslov {
            color: #d0cfcf;
            margin-bottom: 20px;
            font-size: 1rem;
        }
        #mapa {
            width: 100%;
            height: 400px;
            background-color: #d0cfcf;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 2px solid #d0cfcf;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .stat_box {
            background-color: #d0cfcf;
            padding: 15px;
            border-radius: 8px;
            width: 22%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .label {
            font-size: 0.9rem;
            color: #272626;
            margin-bottom: 10px;
        }
        .loading {
            font-size: 1.5rem;
            color: #272626;
            margin-bottom: 10px;
        }   
        .unit {
            font-size: 0.8rem;
            color: #272626;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: #d0cfcf;
        }
        .stat_box_yt {
            background-color: #d0cfcf;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            color: #272626;
        }

    </style>
  </head>
  <body>
    <h1>ISS tracker</h1>
    <p class="podnaslov">
      LIVE pozicija Internacionalne svermiske stanice (updata se svakih 5
      sekundi)
    </p>
    <div id="mapa"></div>

    <div class="stats">
      <div class="stat_box">
        <div class="label">longituda</div>
        <div class="loading" id="lat">--</div>
        <div class="unit">°</div>
      </div>
      <div class="stat_box">
        <div class="label">latituda</div>
        <div class="loading" id="lon">--</div>
        <div class="unit">°</div>
      </div>
      <div class="stat_box">
        <div class="label">altituda</div>
        <div class="loading" id="alt">--</div>
        <div class="unit">km</div>
      </div>
      <div class="stat_box">
        <div class="label">Brzina</div>
        <div class="loading" id="brz">--</div>
        <div class="unit">km/h</div>
      </div>
    </div>

    <div class="YouTube">
      <div class="stat_box_yt">Youtube video UŽIVO<br> <iframe width="840" height="630" src="https://www.youtube-nocookie.com/embed/zPH5KtjJFaQ" frameborder="0" allowfullscreen></iframe></br></div>
    </div>
    <div class="footer">Kreirali: Alan bešić i Leni Jureša | podatci preuzeti iz <a href="https://api.wheretheiss.at/v1/satellites/25544">Where the ISS at</a></div>



    <script></script>
  </body>
</html>
